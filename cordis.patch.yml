# Inserts only this plugin's own row; no shipped DSH component is replaced.
#
# The API key is NOT configured here. Save it in Settings → Agnes 生图; it goes
# into the DSH credential store under `credentialRef`, the same seam the built-in
# model providers use. An environment variable with that name still works as an
# ambient fallback, and `apiKey:` remains available for unattended deployments.
- insert:
    - id: agnes-image
      name: dsh-plugin-agnes-image
      config:
        credentialRef: AGNES_API_KEY
        endpoint: https://apihub.agnes-ai.com/v1/images/generations
        model: agnes-image-2.5-flash
        defaultSize: 2K
        defaultRatio: "1:1"
        outputDir: agnes-output
        timeoutMs: 240000
        downloadTimeoutMs: 120000
        videoEndpoint: https://apihub.agnes-ai.com/v1/videos
        videoQueryEndpoint: https://apihub.agnes-ai.com/agnesapi
        videoModel: agnes-video-2.5-flash
        videoDefaultSeconds: "5"
        videoDefaultAspectRatio: "16:9"
        videoWaitMs: 180000
